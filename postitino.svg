<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff59d"/>
      <stop offset="1" stop-color="#f0dc62"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g transform="rotate(3 256 256)">
    <rect x="112" y="112" width="288" height="288" rx="18" ry="18"
          fill="url(#paper)" filter="url(#shadow)"/>

    <rect x="112" y="112" width="288" height="288" rx="18" ry="18"
          fill="url(#paper)"/>

    <rect x="112" y="112" width="288" height="8" rx="4" ry="4" fill="#000000" opacity="0.06"/>

    <!-- scribbled note lines -->
    <g stroke="#8a7a2a" stroke-linecap="round" stroke-width="16" opacity="0.85">
      <line x1="152" y1="192" x2="360" y2="192"/>
      <line x1="152" y1="240" x2="320" y2="240"/>
      <line x1="152" y1="288" x2="344" y2="288"/>
      <line x1="152" y1="336" x2="268" y2="336"/>
    </g>
  </g>

  <!-- tape -->
  <g transform="rotate(3 256 256)">
    <path d="M 190 96 L 322 96 L 342 148 L 170 148 Z"
          fill="#fdfdfd" opacity="0.55"/>
  </g>
</svg>
